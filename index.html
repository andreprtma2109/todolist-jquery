<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List - jQuery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>📝 Todo List</h1>
            <p>Kelola aktivitas harianmu</p>
        </div>

        <div class="input-section">
            <input type="text" id="todoInput" placeholder="Tambahkan tugas baru..." />
            <button id="addBtn">Tambah</button>
        </div>

        <div class="filter-section">
            <button class="filter-btn active" data-filter="all">Semua</button>
            <button class="filter-btn" data-filter="active">Aktif</button>
            <button class="filter-btn" data-filter="done">Selesai</button>
        </div>

        <ul id="todoList"></ul>

        <div class="footer">
            <span id="itemCount">0 tugas tersisa</span>
            <button id="clearDone">Hapus Selesai</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
